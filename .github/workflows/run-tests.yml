name: Run TaskOneTests
on:
  workflow_dispatch:
  push:
    branches: [ flow ]
# (use [ main ] if you’re working on main)
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          chmod +x mvnw || true
          ./mvnw -q -e -DfailIfNoTests=false test || mvn -q -e -DfailIfNoTests=false test
